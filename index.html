<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nippon Héritage - Assistant virtuel</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f3f5;
    margin: 0;
    padding: 20px;
}

.chatbot {
    max-width: 550px;
    margin: 40px auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 4px 20px #0002;
    overflow: hidden;
}

.header {
    background: #172c46;
    color: white;
    padding: 20px;
    text-align: center;
}

.header h2 {
    margin: 0 0 8px;
}

.messages {
    height: 380px;
    overflow-y: auto;
    padding: 20px;
}

.message {
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 12px;
    max-width: 85%;
    white-space: pre-wrap;
}

.bot {
    background: #e9ecef;
}

.client {
    background: #d5e8ff;
    margin-left: auto;
}

form {
    display: flex;
    padding: 15px;
    gap: 10px;
    border-top: 1px solid #ddd;
}

input, #reponse {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

#reponse { resize: vertical; min-height: 110px; max-height: 280px; font: inherit; line-height: 1.45; box-sizing: border-box; }
#formulaire { align-items: flex-end; }
button {
    background: #172c46;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #294d77;
}

.actions {
    padding: 0 15px 15px;
}

.actions button {
    width: 100%;
}

#microphone[aria-pressed="true"] { background: #a72a39; }
#microphone:disabled { opacity: .5; }
.voice-status { padding: 0 15px 10px; font-size: 14px; color: #36465a; }
.coords { padding: 16px; border-top: 1px solid #ddd; } .coords label {display:block;margin:8px 0 4px;font-weight:bold;} .field {display:flex;gap:8px;} .field input{flex:1;} .coords button[type=submit]{margin-top:12px;width:100%;}</style>
</head>

<body>

<div class="chatbot">

    <div class="header">
        <h2>Nippon Héritage</h2>
        <div>Votre assistant virtuel</div>
    </div>

    <div class="messages" id="messages"></div>

    <form id="formulaire">
        <textarea
            id="reponse"
            rows="5"
            maxlength="5000"
            placeholder="Décrivez votre demande en détail, sur plusieurs lignes..."
            aria-label="Votre message"
        ></textarea>
        <button type="button" id="microphone" aria-label="Activer la dictée vocale" title="Dicter un message" hidden>🎤</button>
        <button type="submit">Envoyer</button>
    </form>

    <form id="coords" class="coords" style="display:none" novalidate><h3>Vos coordonnées</h3><label for="client-nom">Nom et prénom</label><div class="field"><input id="client-nom" required><button type="button" class="mic-field" data-id="client-nom" hidden>🎤</button></div><label for="client-email">Adresse e-mail</label><div class="field"><input id="client-email" type="email" required><button type="button" class="mic-field" data-id="client-email" hidden>🎤</button></div><label for="client-tel">Téléphone (facultatif)</label><div class="field"><input id="client-tel" type="tel"><button type="button" class="mic-field" data-id="client-tel" hidden>🎤</button></div><p id="coord-error" role="alert" style="color:#a32636"></p><button type="submit">Valider mes coordonnées</button></form><div id="voice-status" class="voice-status" role="status" aria-live="polite"></div>
    <div class="actions" id="actions"></div>

</div>

<script>

const clientSlug = new URLSearchParams(location.search).get("client") || "nippon-heritage";
let companyName = "";
let clientReady = false;
const configPromise = (async () => {
 const resp = await fetch("https://obvzuccjxgjlaieghmxm.supabase.co/functions/v1/kervenoa-chat-config?client="+encodeURIComponent(clientSlug));
 if(!resp.ok) throw Error("Lien client inconnu ou indisponible");
 const data = await resp.json();
 if(data.slug!==clientSlug || !data.companyName) throw Error("Configuration incorrecte");
 companyName=data.companyName;
 document.querySelector(".header h2").textContent=companyName;
 document.title=companyName+" - Assistant virtuel";
 return data;
})();
const messages = document.getElementById("messages");
const formulaire = document.getElementById("formulaire");
const reponse = document.getElementById("reponse");
const actions = document.getElementById("actions");


const microphone = document.getElementById("microphone");
const voiceStatus = document.getElementById("voice-status");
const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let voiceTarget = reponse;
if (SpeechRecognitionClass) {
    microphone.hidden = false;
    recognition = new SpeechRecognitionClass();
    recognition.lang = "fr-FR";
    recognition.continuous = true;
    recognition.interimResults = true;
    let voiceBase = "";
    let lastTranscript = "";
    recognition.onstart = () => {
        listening = true;
        voiceBase = voiceTarget.value.trim();
        lastTranscript = "";
        microphone.setAttribute("aria-pressed", "true");
        microphone.textContent = "⏹";
        voiceStatus.textContent = "Dictée en cours… Parlez librement, puis appuyez sur ⏹ pour terminer.";
    };
    recognition.onresult = (event) => {
        const transcription = Array.from(event.results).map(result => result[0].transcript).join(" ").trim();
        lastTranscript = transcription;
        let value = transcription;
        if (voiceTarget.id === "client-email") value = value.toLowerCase().replace(/\\s*(?:arobase|arrobase)\\s*/gi,"@").replace(/\\s+point\\s+/gi,".").replace(/\\s+/g,"");
        voiceTarget.value = [voiceBase, value].filter(Boolean).join(voiceTarget.id === "client-email" ? "" : " ");
        voiceStatus.textContent = "Dictée en cours… Appuyez sur ⏹ lorsque vous avez terminé.";
    };
    recognition.onerror = (event) => {
        const messages = {
            "not-allowed": "Autorisez le microphone dans les paramètres du navigateur.",
            "audio-capture": "Aucun microphone accessible. Vérifiez votre casque ou microphone.",
            "no-speech": "Aucune parole détectée. Cliquez sur le microphone pour réessayer."
        };
        voiceStatus.textContent = messages[event.error] || "Reconnaissance vocale indisponible. Réessayez.";
    };
    recognition.onend = () => {
        listening = false;
        microphone.setAttribute("aria-pressed", "false");
        microphone.textContent = "🎤";
    };
    document.querySelectorAll(".mic-field").forEach(button => {
        button.hidden = false;
        button.addEventListener("click", () => {
            voiceTarget = document.getElementById(button.dataset.id);
            if (listening) recognition.stop();
            else try { recognition.start(); } catch(e) { voiceStatus.textContent = "Microphone indisponible."; }
        });
    });
    microphone.addEventListener("click", () => {
        voiceTarget = reponse;
        if (listening) { recognition.stop(); return; }
        try { recognition.start(); }
        catch (error) { voiceStatus.textContent = "Impossible de démarrer la dictée pour le moment."; }
    });
} else {
    voiceStatus.textContent = "Dictée vocale non disponible sur ce navigateur.";
}

let etape = 0;

const donnees = {
    demande: "",
    modele: "",
    precisions: "",
    email: "",
    telephone: "",
    nom: "",
    kilometrage: "",
    immobilisation: "",
    derniereRevision: "",
    problemes: "",
    details: ""
};


function nettoyerModele(texte) {
    if (!texte || texte === "Non précisé" || texte === "Indiqué dans la demande") return texte;
    let resultat = texte.trim()
        .replace(/^(?:il s['’]agit d['’]une?|c['’]est une?|la moto (?:est|concernée est)|j['’]ai une?|je possède une?)\s+/i, "")
        .replace(/^(?:une?|d['’]une?)\s+/i, "")
        .replace(/[.!?]+$/g, "").trim();
    // Conserver la marque, le modèle et le millésime, sans inventer de caractéristiques.
    resultat = resultat.replace(/\b(?:de|du|en|année)\s+(19\d{2}|20\d{2})\b/gi, "$1");
    return resultat || texte;
}
function nettoyerPrestation(texte) {
    if (!texte || texte === "Aucune précision supplémentaire") return texte;
    let resultat = texte.trim().replace(/[.!?]+$/g, "")
        .replace(/^(?:je (?:voudrais|souhaite|veux|désire)(?: faire| effectuer)?|j['’]aimerais|il faudrait|pouvez-vous|merci de|faire|effectuer)\s+/i, "")
        .replace(/^(?:faire|effectuer|réaliser|procéder à)\s+/i, "")
        .replace(/^(?:la|le|les|sa|son|ses|une|un)\s+/i, "");
    if (/^r[eé]vision annuelle$/i.test(resultat)) return "Révision annuelle";
    return resultat ? resultat.charAt(0).toUpperCase() + resultat.slice(1) : texte;
}

function afficherMessage(texte, type) {
    const message = document.createElement("div");

    message.className = "message " + type;
    message.textContent = texte;

    messages.appendChild(message);
    messages.scrollTop = messages.scrollHeight;
}

function question(texte) {
    afficherMessage(texte, "bot");
    reponse.focus();
}

function estVideOuPasse(texte) {
    return !texte || /^(passer|je ne sais pas|aucun|non)$/i.test(texte);
}

function modeleDejaMentionne(texte) {
    const modeles = [
        /\b(?:CB|CBR|CBF|CX|GL|VT|VFR|XL|XR|CRF)\s?-?\d{2,4}\b/i,
        /\b(?:XT|XJ|XS|YZF|MT|FZR|FZ|RD)\s?-?\d{2,4}\b/i,
        /\b(?:GSX|GSXR|GSX-R|GS|DR|SV|V-STROM)\s?-?\d{2,4}\b/i,
        /\b(?:ZZR|ZXR|ZX|Z|GPZ|GPX|ER)\s?-?\d{2,4}\b/i,
        /\b(?:R|K|F|S)\s?\d{3,4}\s?(?:GS|RR|R)?\b/i,
        /\b(?:Bonneville|Speed Twin|Street Triple|Thruxton|Monster|Scrambler)\b/i
    ];

    return modeles.some(modele => modele.test(texte));
}

reponse.disabled = true;
configPromise.then(() => {
 clientReady=true;
 reponse.disabled=false;
 question("Bonjour et bienvenue chez "+companyName+" !\\n\\nEn quoi puis-je vous aider aujourd'hui ?");
}).catch(() => {
 question("Ce lien client n'est pas disponible pour le moment. Veuillez vérifier l'adresse.");
 formulaire.style.display="none";
});

const historique = [];
let questionsPosees = 0;
let enCours = false;
formulaire.addEventListener("submit", async function(event) {
 event.preventDefault();
 const texte = reponse.value.trim();
 if (!texte || enCours || !clientReady) return;
 enCours = true;
 const envoyer = formulaire.querySelector('button[type="submit"]');
 envoyer.disabled = true;
 envoyer.textContent = "Réflexion…";
 const prochainHistorique = [...historique,{role:"user",content:texte}];
 try {
  const result=await fetch("https://nautia.vercel.app/api/chat",{
   method:"POST", headers:{"Content-Type":"application/json"},
   body:JSON.stringify({client:clientSlug,messages:prochainHistorique,questionsAsked:questionsPosees})
  });
  const data=await result.json();
  if(!result.ok||!data.ok)throw new Error(data.error||"Réponse indisponible");
  afficherMessage(texte,"client");
  reponse.value="";
  historique.push({role:"user",content:texte},{role:"assistant",content:data.reply});
  if(!donnees.demande)donnees.demande=texte;
  donnees.demande=data.summary?.demande||donnees.demande;
  donnees.modele=data.summary?.objet||donnees.modele;
  donnees.precisions=data.summary?.travaux||donnees.precisions;
  donnees.details=data.summary?.details||donnees.details;
  question(data.reply);
  if(data.done){
   formulaire.style.display="none";
   if(clientSlug==="armel-nautic") question("Mode démonstration : la demande sera envoyée uniquement à KERVENOA, jamais au chantier Armel Nautic.");
   document.getElementById("coords").style.display="block";
   document.getElementById("coords").scrollIntoView({behavior:"smooth",block:"center"});
  }else questionsPosees++;
 }catch(error){
  afficherMessage("Le service de conversation est momentanément indisponible : "+error.message+" Vous pouvez réessayer sans perdre votre message.","bot");
 }finally{
  enCours=false;envoyer.disabled=false;envoyer.textContent="Envoyer";
 }
});

document.getElementById("coords").addEventListener("submit", async function(event) {
    event.preventDefault();
    const nom = document.getElementById("client-nom").value.trim();
    const email = document.getElementById("client-email").value.trim();
    const tel = document.getElementById("client-tel").value.trim();
    if (!nom || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById("coord-error").textContent = "Validation impossible : indiquez un nom et une adresse e-mail valide (exemple : nom@gmail.com).";
        return;
    }
    document.getElementById("coord-error").textContent = "";
    donnees.nom = nom;
    donnees.email = email;
    donnees.telephone = tel || "Non communiqué";
    const button = document.querySelector('#coords button[type="submit"]');
    button.disabled = true;
    button.textContent = "Envoi en cours…";
    const status = document.getElementById("coord-error");
    status.textContent = "Transmission sécurisée de votre demande…";
    try {
        const res = await fetch("https://nautia.vercel.app/api/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...donnees, client: clientSlug, messagesClient: historique.filter(m => m.role === "user").map(m => m.content).slice(0, 24), website: "" })
        });
        const answer = await res.json();
        if (!res.ok || !answer.ok) throw new Error(answer.error || "Échec de l'envoi.");
        document.getElementById("coords").style.display = "none";
        terminerConversation(true);
        messages.scrollIntoView({ behavior: "smooth", block: "end" });
    } catch(error) {
        status.textContent = "Envoi non confirmé : " + error.message + " Vous pouvez réessayer sans ressaisir vos coordonnées.";
    } finally {
        button.disabled = false;
        button.textContent = "Valider mes coordonnées";
    }
});
function terminerConversation(envoye = false) {

    const resume =
        "DEMANDE " + companyName.toUpperCase() + "\n\n" +
        "Objet : " + (donnees.modele || "Non précisé") + "\n" +
        "Travaux demandés : " + (donnees.precisions || donnees.demande) + "\n" +
        "Demandes exprimées par le visiteur :\n" + historique.filter(m => m.role === "user").map(m => "• " + m.content).join("\n") + "\n" +
        (donnees.details ? "Informations utiles : " + donnees.details + "\n" : "") +
        "\nNom : " + donnees.nom + "\n" +
        "E-mail : " + donnees.email + "\n" +
        "Téléphone : " + donnees.telephone;

    afficherMessage(
        "Merci pour votre demande !\n\n" +
        "Voici le récapitulatif des informations recueillies :\n\n" +
        resume +
        (envoye ? (clientSlug === "armel-nautic" ? "\n\nDemande de test transmise uniquement à KERVENOA. Aucun envoi à Armel Nautic." : "\n\nVotre demande a été transmise aux destinataires configurés.") : "\n\nVotre demande n’a pas été envoyée."),
        "bot"
    );

    if (recognition && listening) recognition.stop();
    formulaire.style.display = "none";

    const bouton = document.createElement("button");
    bouton.textContent = "Copier le récapitulatif";

    bouton.addEventListener("click", async function() {
        try {
            await navigator.clipboard.writeText(resume);
            bouton.textContent = "Récapitulatif copié !";
        } catch (erreur) {
            bouton.textContent = "Copie indisponible";
        }
    });

    actions.appendChild(bouton);
}

</script>

</body>
</html>
