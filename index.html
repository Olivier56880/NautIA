<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nippon Héritage - Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            margin: 0;
            padding: 20px;
        }

        .chatbot {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px #0002;
            overflow: hidden;
        }

        .header {
            background: #172c46;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            margin: 0 0 8px;
        }

        .messages {
            height: 350px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 12px;
            max-width: 85%;
            white-space: pre-wrap;
        }

        .bot {
            background: #e9ecef;
        }

        .client {
            background: #d5e8ff;
            margin-left: auto;
        }

        form {
            display: flex;
            padding: 15px;
            gap: 10px;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #172c46;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .actions {
            padding: 0 15px 15px;
        }

        .actions button {
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="chatbot">

        <div class="header">
            <h2>Nippon Héritage</h2>
            <div>Votre assistant virtuel</div>
        </div>

        <div class="messages" id="messages"></div>

        <form id="formulaire">
            <input
                id="reponse"
                type="text"
                placeholder="Écrivez votre réponse..."
                required
            >
            <button type="submit">Envoyer</button>
        </form>

        <div class="actions" id="actions"></div>

    </div>

    <script>
        const questions = [
            {
                cle: "prenom",
                texte: "Bonjour ! Bienvenue chez Nippon Héritage. Quel est votre prénom ?"
            },
            {
                cle: "email",
                texte: "Quelle est votre adresse e-mail ?"
            },
            {
                cle: "telephone",
                texte: "Quel est votre numéro de téléphone ?"
            },
            {
                cle: "moto",
                texte: "Quelle moto vous intéresse ou possédez-vous ?"
            },
            {
                cle: "demande",
                texte: "Souhaitez-vous un renseignement, un devis ou des informations sur une moto ?"
            },
            {
                cle: "details",
                texte: "Pouvez-vous préciser votre demande ?"
            }
        ];

        let etape = 0;
        const donnees = {};

        const messages = document.getElementById("messages");
        const formulaire = document.getElementById("formulaire");
        const reponse = document.getElementById("reponse");
        const actions = document.getElementById("actions");

        function afficherMessage(texte, type) {
            const message = document.createElement("div");
            message.className = "message " + type;
            message.textContent = texte;

            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }

        afficherMessage(questions[0].texte, "bot");

        formulaire.addEventListener("submit", function(event) {
            event.preventDefault();

            const texte = reponse.value.trim();

            if (!texte) {
                return;
            }

            afficherMessage(texte, "client");

            donnees[questions[etape].cle] = texte;

            reponse.value = "";
            etape++;

            if (etape < questions.length) {
                afficherMessage(questions[etape].texte, "bot");
            } else {
                terminerConversation();
            }
        });

        function terminerConversation() {
            const resume =
                "DEMANDE NIPPON HÉRITAGE\n\n" +
                "Prénom : " + donnees.prenom + "\n" +
                "E-mail : " + donnees.email + "\n" +
                "Téléphone : " + donnees.telephone + "\n" +
                "Moto : " + donnees.moto + "\n" +
                "Objet : " + donnees.demande + "\n" +
                "Détails : " + donnees.details;

            afficherMessage(
                "Merci ! Votre demande est préparée.\n\n" +
                resume +
                "\n\nL'envoi automatique par e-mail sera disponible prochainement.",
                "bot"
            );

            formulaire.style.display = "none";

            const bouton = document.createElement("button");
            bouton.textContent = "Copier la demande";

            bouton.onclick = async function() {
                try {
                    await navigator.clipboard.writeText(resume);
                    bouton.textContent = "Demande copiée !";
                } catch (erreur) {
                    bouton.textContent = "Copie indisponible";
                }
            };

            actions.appendChild(bouton);
        }
    </script>

</body>
</html>
